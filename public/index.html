<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestBench · Web 测试平台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f9cf9'/%3E%3Cpath d='M8 20l5-9 4 6 3-4 4 7z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">TB</div>
          <div class="brand-text">
            <strong>TestBench</strong>
            <span>测试编排平台</span>
          </div>
        </div>

        <nav class="nav" id="nav">
          <a class="nav-item" data-route="/dashboard" href="#/dashboard">
            <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-12h8V3h-8v6z"/></svg>
            <span>概览</span>
          </a>
          <a class="nav-item" data-route="/new" href="#/new">
            <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
            <span>新建测试</span>
          </a>
          <a class="nav-item" data-route="/runs" href="#/runs">
            <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 100 18 9 9 0 000-18zm1 13.6l-4.5-2.6V7h1.5v6l3.9 2.3-.9 1.3z"/></svg>
            <span>历史记录</span>
          </a>
          <a class="nav-item" data-route="/datasets" href="#/datasets">
            <svg viewBox="0 0 24 24"><path d="M12 3C7 3 3 4.6 3 6.5v11C3 19.4 7 21 12 21s9-1.6 9-3.5v-11C21 4.6 17 3 12 3zm0 2c4.4 0 7 1.3 7 1.5S16.4 8 12 8 5 6.7 5 6.5 7.6 5 12 5zm7 12.5c0 .2-2.6 1.5-7 1.5s-7-1.3-7-1.5v-2.2c1.6.9 4.3 1.2 7 1.2s5.4-.3 7-1.2v2.2zm0-4c0 .2-2.6 1.5-7 1.5s-7-1.3-7-1.5v-2.2c1.6.9 4.3 1.2 7 1.2s5.4-.3 7-1.2v2.2z"/></svg>
            <span>数据集</span>
          </a>
          <a class="nav-item" data-route="/settings" href="#/settings">
            <svg viewBox="0 0 24 24"><path d="M19.4 13a7.8 7.8 0 000-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 00-1.7-1L14.9 3h-3.9l-.4 2.6c-.6.2-1.2.6-1.7 1l-2.4-1-2 3.4L6.6 11a7.8 7.8 0 000 2l-2 1.6 2 3.4 2.4-1c.5.5 1.1.8 1.7 1l.4 2.6h3.9l.4-2.6c.6-.2 1.2-.6 1.7-1l2.4 1 2-3.4-2.1-1.6zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg>
            <span>环境诊断</span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <div class="env-mini" id="env-mini">
            <span class="dot dot-idle"></span>
            <span>检测中…</span>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-new-run">＋ 新建测试</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="crumb" id="crumb">概览</div>
          <div class="topbar-actions">
            <div class="pills" id="engine-pills"></div>
            <button class="btn btn-ghost btn-sm" id="btn-refresh" title="刷新当前页面">↻ 刷新</button>
          </div>
        </header>
        <div class="view" id="view"></div>
      </main>
    </div>

    <div class="toasts" id="toasts"></div>
    <div class="modal-root" id="modal-root"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
